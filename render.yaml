services:
  - type: web
    name: audiohunt-api
    env: docker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_DSN
        sync: false
